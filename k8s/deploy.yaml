apiVersion: v1
kind: Service
metadata:
  labels:
    app: myapp
  name: appsvc
spec:
  ports:
  - port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    app: myapp
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: myapp
  name: myapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - image: noeldevops/myapp-dev:29
        name: myapp-dev
        ports:
        - containerPort: 8080