# Namespace (optional)
apiVersion: v1
kind: Namespace
metadata:
  name: sonarqube
---
# PostgreSQL Secret
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: sonarqube
  labels:
    app: postgres
stringData:
  POSTGRES_USER: sonar
  POSTGRES_PASSWORD: sonarpass
---
# SonarQube Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarqube
  namespace: sonarqube
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sonarqube
  template:
    metadata:
      labels:
        app: sonarqube
    spec:
      containers:
      - name: sonarqube
        image: sonarqube:9.9-community
        ports:
        - containerPort: 9000
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        env:
        - name: SONAR_JDBC_URL
          value: jdbc:postgresql://postgres:5432/sonar
        - name: SONAR_JDBC_USERNAME
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
        - name: SONAR_JDBC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        volumeMounts:
        - name: sonar-data
          mountPath: /opt/sonarqube/data
        - name: sonar-extensions
          mountPath: /opt/sonarqube/extensions
        - name: sonar-logs
          mountPath: /opt/sonarqube/logs
      volumes:
      - name: sonar-data
        emptyDir: {}  # Replace with PersistentVolumeClaim in production
      - name: sonar-extensions
        emptyDir: {}
      - name: sonar-logs
        emptyDir: {}
---
# SonarQube Service
apiVersion: v1
kind: Service
metadata:
  name: sonarqube
  namespace: sonarqube
spec:
  selector:
    app: sonarqube
  ports:
  - port: 9000
    targetPort: 9000
    protocol: TCP
  type: NodePort  # Change to LoadBalancer or ClusterIP as needed

