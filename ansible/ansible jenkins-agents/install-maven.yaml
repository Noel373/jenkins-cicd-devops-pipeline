#ansible playbook to install maven on jenkins agents
- name: Install Maven on Jenkins Agents
  hosts: localhost
  become: yes
  tasks:
    - name: Ensure Java is installed
      apt:
        name: openjdk-11-jdk
        state: present
      when: ansible_os_family == "Debian"

    - name: Ensure Java is installed
      yum:
        name: java-11-openjdk-devel
        state: present
      when: ansible_os_family == "RedHat"

    - name: Download Maven binary
      get_url:
        url: https://archive.apache.org/dist/maven/maven-3/3.8.6/binaries/apache-maven-3.8.6-bin.tar.gz
        dest: /tmp/apache-maven-3.8.6-bin.tar.gz

    - name: Extract Maven binary
      unarchive:
        src: /tmp/apache-maven-3.8.6-bin.tar.gz
        dest: /opt/
        remote_src: yes

    - name: Create symlink for Maven
      file:
        src: /opt/apache-maven-3.8.6
        dest: /opt/maven
        state: link

    - name: Set up Maven environment variables
      copy:
        dest: /etc/profile.d/maven.sh
        content: |
          export M2_HOME=/opt/maven
          export PATH=${M2_HOME}/bin:${PATH}
        mode: '0755'

    - name: Verify Maven installation
      command: /opt/maven/bin/mvn -version
      register: maven_version

    - name: Display Maven version
      debug:
        msg: "{{ maven_version.stdout }}"