---
- name: Kubernetes Master Node Setup
  hosts: k8s_master
  become: yes
  vars:
    private_ip: "{{ ansible_default_ipv4.address }}"
  tasks:

    - name: Disable swap (permanently and temporarily)
      block:
        - name: Disable swap in fstab
          replace:
            path: /etc/fstab
            regexp: '^([^#].*\s+swap\s+)'
            replace: '# \1'

        - name: Turn off swap
          command: swapoff -a
      rescue:
        - name: Log failure to disable swap
          debug:
            msg: " Failed to disable swap, check manually."

    - name: Load kernel modules for Kubernetes networking
      block:
        - name: Ensure br_netfilter is loaded
          modprobe:
            name: br_netfilter
            state: present

        - name: Set required sysctl params
          copy:
            dest: /etc/sysctl.d/k8s.conf
            content: |
              net.bridge.bridge-nf-call-iptables = 1
              net.ipv4.ip_forward = 1
              net.bridge.bridge-nf-call-ip6tables = 1

        - name: Apply sysctl changes
          command: sysctl --system
      rescue:
        - name: Log kernel module or sysctl error
          debug:
            msg: " Failed to load kernel modules or apply sysctl settings."

    - name: Install containerd
      block:
        - name: Install dependencies
          apt:
            name:
              - ca-certificates
              - curl
              - gnupg
              - lsb-release
            state: present
            update_cache: yes

        - name: Add Docker’s GPG key
          shell: |
            install -m 0755 -d /etc/apt/keyrings
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
            chmod a+r /etc/apt/keyrings/docker.gpg
          args:
            creates: /etc/apt/keyrings/docker.gpg

        - name: Add Docker repo
          apt_repository:
            repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_lsb.codename }} stable"
            filename: docker
            state: present

        - name: Install containerd
          apt:
            name: containerd.io
            state: present
            update_cache: yes

        - name: Configure containerd with default config
          shell: |
            containerd config default > /etc/containerd/config.toml
            systemctl restart containerd
            systemctl enable containerd
      rescue:
        - name: Log containerd install error
          debug:
            msg: "Failed to install or configure containerd."

    - name: Install Kubernetes components (kubeadm, kubelet, kubectl)
      block:
        - name: Install Kubernetes APT key
          shell: |
            mkdir -p /etc/apt/keyrings
            curl -fsSLo /etc/apt/keyrings/kubernetes-archive-keyring.gpg https://packages.cloud.google.com/apt/doc/apt-key.gpg

        - name: Add Kubernetes repo
          apt_repository:
            repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-archive-keyring.gpg] https://apt.kubernetes.io/ kubernetes-xenial main"
            filename: kubernetes
            state: present

        - name: Install Kubernetes packages
          apt:
            name:
              - kubelet
              - kubeadm
              - kubectl
            state: present
            update_cache: yes

        - name: Hold kube components at current version
          apt:
            name:
              - kubelet
              - kubeadm
              - kubectl
            state: present
            mark: hold
      rescue:
        - name: Log Kubernetes install error
          debug:
            msg: " Failed to install kubelet/kubeadm/kubectl."

    - name: Initialize Kubernetes Control Plane
      block:
        - name: kubeadm init with private IP
          command: >
            kubeadm init
            --apiserver-advertise-address={{ private_ip }}
            --pod-network-cidr=192.168.0.0/16
          register: init_output
          changed_when: false

        - name: Save kubeadm join command
          shell: |
            kubeadm token create --print-join-command > /join-command.sh
          args:
            creates: /join-command.sh

        - name: Set up kubeconfig for ubuntu user
          become_user: ubuntu
          shell: |
            mkdir -p /home/ubuntu/.kube
            cp -i /etc/kubernetes/admin.conf /home/ubuntu/.kube/config
            chown ubuntu:ubuntu /home/ubuntu/.kube/config
      rescue:
        - name: Log init error
          debug:
            msg: " kubeadm init failed. Check logs."

    - name: Deploy Calico CNI
      become_user: ubuntu
      shell: |
        kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.30.2/manifests/tigera-operator.yaml
        kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.30.2/manifests/custom-resources.yaml
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      register: calico_output
      changed_when: false
      ignore_errors: true
