# Playbook to install Docker and add ubuntu user to docker group, with a reboot
- name: Prepare Jenkins SSH Build Agent for Docker
  hosts: build_agent
  become: true
  vars:
    agent_user: ubuntu

  tasks:
    - name: Ensure build agent user exists
      user:
        name: "{{ agent_user }}"
        shell: /bin/bash
        state: present
        create_home: yes

    - name: Install required packages
      package:
        name: "{{ item }}"
        state: present
      loop:
        - apt-transport-https
        - ca-certificates
        - curl
        - gnupg
        - lsb-release
      when: ansible_os_family == "Debian"

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg
        state: present
      when: ansible_os_family == "Debian"

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
        state: present
      when: ansible_os_family == "Debian"

    - name: Install Docker
      package:
        name: docker.io
        state: present

    - name: Enable and start Docker
      systemd:
        name: docker
        enabled: true
        state: started

    - name: Add agent user to docker group
      user:
        name: "{{ agent_user }}"
        groups: docker
        append: yes

    - name: Print Docker version for verification
      command: docker --version
      register: docker_version
      changed_when: false

    - name: Show Docker version
      debug:
        var: docker_version.stdout

    - name: Reboot the machine to apply group membership changes
      reboot:
        msg: "Rebooting the system to apply Docker group changes"
        pre_reboot_delay: 5
        post_reboot_delay: 15
        reboot_timeout: 600
