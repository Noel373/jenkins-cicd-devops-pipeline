---
- name: Install Nexus Repository Manager 3 with error handling and cleanup
  hosts: nexus
  become: yes

  vars:
    nexus_version: "3.66.0-02"
    nexus_user: "nexus"
    nexus_group: "nexus"
    nexus_install_dir: "/opt/nexus"
    nexus_data_dir: "/opt/sonatype-work"
    nexus_download_url: "https://download.sonatype.com/nexus/3/nexus-{{ nexus_version }}-unix.tar.gz"

  tasks:

    - block:
        - name: Install Java 11 (Ubuntu)
          apt:
            name: openjdk-11-jdk
            state: present
            update_cache: yes
          when: ansible_facts['os_family'] == "Debian"
          tags: java

        - name: Install Java 8 (RHEL)
          dnf:
            name: java-1.8.0-openjdk
            state: present
          when: ansible_facts['os_family'] == "RedHat"
          tags: java

        - name: Create nexus group
          group:
            name: "{{ nexus_group }}"
            state: present

        - name: Create nexus user
          user:
            name: "{{ nexus_user }}"
            group: "{{ nexus_group }}"
            shell: /bin/bash
            create_home: yes

        - name: Download Nexus
          get_url:
            url: "{{ nexus_download_url }}"
            dest: "/tmp/nexus.tar.gz"
            mode: '0644'

        - name: Extract Nexus
          unarchive:
            src: "/tmp/nexus.tar.gz"
            dest: "/opt/"
            remote_src: yes
            creates: "{{ nexus_install_dir }}"
          register: nexus_extract

        - name: Rename nexus extracted folder
          command: mv "/opt/nexus-{{ nexus_version }}" "{{ nexus_install_dir }}"
          args:
            creates: "{{ nexus_install_dir }}"
          when: nexus_extract.changed

        - name: Ensure nexus user owns install directories
          file:
            path: "{{ item }}"
            owner: "{{ nexus_user }}"
            group: "{{ nexus_group }}"
            recurse: yes
          loop:
            - "{{ nexus_install_dir }}"
            - "{{ nexus_data_dir }}"

        - name: Set run_as_user in nexus.rc
          copy:
            dest: "{{ nexus_install_dir }}/bin/nexus.rc"
            content: |
              run_as_user="{{ nexus_user }}"
            owner: "{{ nexus_user }}"
            group: "{{ nexus_group }}"
            mode: '0644'

        - name: Create systemd service for Nexus
          copy:
            dest: /etc/systemd/system/nexus.service
            content: |
              [Unit]
              Description=nexus service
              After=network.target

              [Service]
              Type=forking
              LimitNOFILE=65536
              User={{ nexus_user }}
              Group={{ nexus_group }}
              Environment=JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64
              ExecStart={{ nexus_install_dir }}/bin/nexus start
              ExecStop={{ nexus_install_dir }}/bin/nexus stop
              Restart=on-abort

              [Install]
              WantedBy=multi-user.target
            mode: '0644'
          notify: Reload systemd daemon

        - name: Enable and start Nexus service
          systemd:
            name: nexus
            enabled: yes
            state: started

      rescue:
        - name: Cleanup Nexus after failure
          block:
            - name: Stop Nexus service if running
              systemd:
                name: nexus
                state: stopped
                enabled: no
              ignore_errors: yes

            - name: Remove nexus systemd service file
              file:
                path: /etc/systemd/system/nexus.service
                state: absent

            - name: Reload systemd daemon
              command: systemctl daemon-reload

            - name: Remove Nexus install directory
              file:
                path: "{{ nexus_install_dir }}"
                state: absent

            - name: Remove Nexus data directory
              file:
                path: "{{ nexus_data_dir }}"
                state: absent

            - name: Remove nexus user
              user:
                name: "{{ nexus_user }}"
                state: absent
                remove: yes
                force: yes

            - name: Remove nexus group
              group:
                name: "{{ nexus_group }}"
                state: absent

      always:
        - name: Completion message
          debug:
            msg: "Nexus installation task finished — either successfully or after cleanup on failure."

  handlers:
    - name: Reload systemd daemon
      command: systemctl daemon-reload
