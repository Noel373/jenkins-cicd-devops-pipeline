---
- name: Configure passwordless SSH on server-test
  hosts: server-test
  become: true

  vars:
    ansible_user_name: ansible
    ansible_pub_key: "{{ lookup('file', '/home/ansible/.ssh/id_rsa.pub') }}"

  tasks:
    - name: Ensure ansible user exists
      user:
        name: "{{ ansible_user_name }}"
        shell: /bin/bash
        create_home: yes

    - name: Create .ssh directory
      file:
        path: "/home/{{ ansible_user_name }}/.ssh"
        state: directory
        mode: '0700'
        owner: "{{ ansible_user_name }}"
        group: "{{ ansible_user_name }}"

    - name: Set authorized_keys
      copy:
        content: "{{ ansible_pub_key }}"
        dest: "/home/{{ ansible_user_name }}/.ssh/authorized_keys"
        mode: '0600'
        owner: "{{ ansible_user_name }}"
        group: "{{ ansible_user_name }}"

    - name: Ensure SSH daemon allows public key authentication
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PubkeyAuthentication'
        line: 'PubkeyAuthentication yes'
        state: present
        backup: yes

    - name: Disable password authentication (optional)
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication no'
        state: present
        backup: yes

    - name: Restart SSH service
      service:
        name: sshd
        state: restarted
